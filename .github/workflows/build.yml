name: build
on:
  pull_request:
  push:
    branches: [ 'main' ]
  workflow_dispatch:
    inputs:
      buildType: # https://cmake.org/cmake/help/latest/variable/CMAKE_CONFIGURATION_TYPES.html
        description: 'CMake build type'
        type: choice
        options:
          - Debug
          - RelWithDebInfo
          - Release
          - MinSizeRel
        required: true
        default: RelWithDebInfo
      buildTesting: # https://cmake.org/cmake/help/latest/variable/BUILD_TESTING.html
        description: 'Run tests'
        type: boolean
        default: true
      cmakeArgs:
        description: 'Additional CMake arguments'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-x86:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install --no-install-recommends --no-install-suggests libgl-dev
      - name: Check out Git repository
        uses: actions/checkout@v7
      - name: Configure
        run: cmake -S src -B src/build -G Ninja -DCMAKE_BUILD_TYPE=${{ inputs.buildType || 'RelWithDebInfo' }} -DBUILD_TESTING=${{ !contains(inputs.buildTesting, 'false') }} ${{ inputs.cmakeArgs }}
      - name: Build
        run: cmake --build src/build --parallel 4
      - name: Test
        if: ${{ !contains(inputs.buildTesting, 'false') }}
        run: cmake --build src/build --target test
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: src/build/todo
  windows-x86:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
      - name: Configure
        run: cmake -S src -B src\build -G Ninja -DCMAKE_BUILD_TYPE=${{ inputs.buildType || 'RelWithDebInfo' }} -DBUILD_TESTING=${{ !contains(inputs.buildTesting, 'false') }} ${{ inputs.cmakeArgs }}
      - name: Build
        run: cmake --build src\build --parallel 4
      - name: Test
        if: ${{ !contains(inputs.buildTesting, 'false') }}
        run: cmake --build src\build --target test
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: src\build\todo.exe
  macos-arm:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
      - name: Configure
        run: cmake -S src -B src/build -G Ninja -DCMAKE_BUILD_TYPE=${{ inputs.buildType || 'RelWithDebInfo' }} -DBUILD_TESTING=${{ !contains(inputs.buildTesting, 'false') }} ${{ inputs.cmakeArgs }}
      - name: Build
        run: cmake --build src/build --parallel 4
      - name: Test
        if: ${{ !contains(inputs.buildTesting, 'false') }}
        run: cmake --build src/build --target test
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: src/build/todo
